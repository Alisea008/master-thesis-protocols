[package]
name = "psi-pmi"
version = "0.1.0"
edition = "2021"

[dependencies]

transieve = { path = "../Transieve-main", features = ["bfv"] }
fhe = "0.1.1"
fhe-traits = "0.1"
bincode = "1"
anyhow = "1"

curve25519-dalek = { version = "4", features = ["rand_core"] }
