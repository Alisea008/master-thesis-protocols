[package]
name = "transieve"
version = "0.1.0"
edition = "2021"
description = "Evaluation framework for FHE transciphering: swappable workloads, symmetric ciphers, and FHE backends."

[[bin]]
name = "transieve"
path = "src/main.rs"

[lib]
name = "transieve"
path = "src/lib.rs"

[dependencies]
tfhe = { version = "0.8", features = ["boolean", "shortint", "integer", "x86_64"] }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
anyhow = "1"

rand = "0.8"
siphasher = "1"
itertools = "0.13"

fhe = { version = "0.1.1", optional = true }
fhe-traits = { version = "0.1", optional = true }
rand_bfv = { package = "rand", version = "0.9", optional = true }

[features]
bfv = ["dep:fhe", "dep:fhe-traits", "dep:rand_bfv"]

[profile.release]
lto = "thin"
codegen-units = 1
